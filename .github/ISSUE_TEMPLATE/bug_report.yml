name: Bug report / 问题反馈
description: Report a reproducible issue without sharing private documents or keys.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MarginMind / 澜页.
        Please do not upload private documents, gaze logs, API keys, screenshots containing secrets, or raw `storage/` files.
  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题概述
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce / 复现步骤
      placeholder: |
        1. Start the server...
        2. Upload a non-private sample file...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 期望表现
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / 实际表现
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Gaze tracking / 视线追踪
        - Reader UI / 阅读界面
        - Document parsing / 文档解析
        - Note generation / 笔记生成
        - Privacy or security / 隐私或安全
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: Windows 11, Python/Conda version, browser, webcam model if relevant.
  - type: textarea
    id: safe_logs
    attributes:
      label: Safe Logs / 可公开日志
      description: Paste only sanitized logs. Remove keys, file contents, private text, and personal paths if needed.
